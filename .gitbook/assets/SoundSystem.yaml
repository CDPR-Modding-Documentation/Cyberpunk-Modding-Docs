# Button labels for a sound system.
#
# Replace YourMod with your mod's name, in the record path and in the name field both.
# Interactions.* is a table shared with every installed mod, so a prefix that is not unique
# to you collides with another mod's records.
#
# One record per entry in the device's soundSystemSettings. The TweakDBID on an entry sets
# three things at once: the action's name, its caption, and the choice record the UI
# resolves, so one record per entry is all that is needed.
#
# Every caption here is a LocKey the base game already ships, so the buttons read exactly
# like the game's own radio in whatever language the player is using. Nothing here authors
# a string, and nothing here needs translating.
#
# Fourteen stations is more than a screen can show. Keep the entries you want and delete
# the rest.

Interactions.YourMod_AttitudeRock:
  $type: gamedataInteractionBase_Record
  action: Choice1
  name: YourMod_AttitudeRock
  captionIcon: ChoiceCaptionParts.None
  caption: LocKey#Gameplay-Devices-Radio-RadioStationAttRock

