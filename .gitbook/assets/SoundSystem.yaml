# A sound event entry is labelled the same way. There is no station name to borrow, so this
# one uses the game's word for a jukebox. Any LocKey the game ships will do.
#
# If nothing in the game says what you need, ship your own key. Add an entry to a
# localizationPersistenceOnScreenEntries .json in your archive with a secondaryKey of your
# own, register that file in your .xl under localization -> onscreens, and point caption at
# LocKey#Your-Key. That string is yours to translate, unlike the ones above.

Interactions.YourMod_Jukebox:
  $type: gamedataInteractionBase_Record
  action: Choice1
  name: YourMod_Jukebox
  captionIcon: ChoiceCaptionParts.None
  caption: LocKey#Gameplay-Devices-DisplayNames-Jukebox


# An off entry needs no record. Point its interactionName at the base game's Interactions.Off
# and the screen labels it "Turn OFF" on its own.
